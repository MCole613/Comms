<script>
(function () {
  'use strict';

  var state = { boot: null, tasks: [], requests: [], timeline: [], previewTimer: null, lastView: 'new' };

  /* ---------- helpers ---------- */
  function $(sel) { return document.querySelector(sel); }
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'text') node.textContent = attrs[k];
      else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== undefined && attrs[k] !== null && attrs[k] !== false) node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }

  function api(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(e && e.message ? e : new Error(String(e)));
      });
      runner[name].apply(runner, args);
    });
  }

  function parseDate(iso) { var p = String(iso).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function pretty(iso) {
    if (!iso) return '';
    return parseDate(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function daysFromToday(iso) {
    return Math.round((parseDate(iso) - parseDate(state.boot.today)) / 86400000);
  }
  function duePill(task) {
    if (task.status === 'Done') return el('span', { class: 'pill done', text: 'Done' });
    var d = daysFromToday(task.dueDate);
    if (d < 0) return el('span', { class: 'pill overdue', text: (-d) + 'd overdue' });
    if (d === 0) return el('span', { class: 'pill soon', text: 'Due today' });
    if (d <= 3) return el('span', { class: 'pill soon', text: 'In ' + d + 'd' });
    return el('span', { class: 'pill', text: 'In ' + d + 'd' });
  }

  function notice(msg, kind) {
    var n = $('#notice');
    n.className = 'notice ' + (kind || 'ok');
    n.textContent = msg;
    n.hidden = false;
    window.scrollTo(0, 0);
    if (kind !== 'err') setTimeout(function () { n.hidden = true; }, 8000);
  }
  function fail(e) { notice(e.message || String(e), 'err'); }

  /* ---------- navigation ---------- */
  function show(view) {
    document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('active', v.id === 'view-' + view); });
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.dataset.view === view); });
    if (view !== 'detail') state.lastView = view;
    if (view === 'tasks') loadTasks();
    if (view === 'requests') loadRequests();
    if (view === 'timeline') loadTimeline();
  }
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { show(t.dataset.view); });
  });
  $('#backBtn').addEventListener('click', function () { show(state.lastView); });

  /* ---------- boot ---------- */
  api('apiBootstrap').then(function (boot) {
    state.boot = boot;
    $('#appName').textContent = boot.appName;
    $('#who').textContent = boot.user.name + (boot.user.role ? ' · ' + boot.user.role : '');
    if (!boot.user.onTeam) notice("You're not on the Team list yet, so tasks for you will use your email. Ask the communications director to add you.", 'warn');

    var ms = $('#ministrySelect');
    boot.ministries.forEach(function (m) { ms.appendChild(el('option', { value: m, text: m })); });
    if (boot.user.ministry) ms.value = boot.user.ministry;

    var box = $('#deliverables');
    boot.deliverables.forEach(function (d) {
      box.appendChild(el('label', { class: 'check' }, [el('input', { type: 'checkbox', name: 'deliverables', value: d, onchange: schedulePreview }), d]));
    });

    var dateInput = document.querySelector('[name=eventDate]');
    dateInput.min = state.boot.today;
    dateInput.addEventListener('change', schedulePreview);

    refreshTaskBadge();
    google.script.url.getLocation(function (loc) {
      if (loc.parameter && loc.parameter.request) openRequest(loc.parameter.request);
    });
  }).catch(fail);

  /* ---------- new request ---------- */
  function selectedDeliverables() {
    return Array.prototype.map.call(document.querySelectorAll('[name=deliverables]:checked'), function (c) { return c.value; });
  }

  function schedulePreview() {
    clearTimeout(state.previewTimer);
    state.previewTimer = setTimeout(renderPreview, 300);
  }

  function renderPreview() {
    var date = document.querySelector('[name=eventDate]').value;
    var dels = selectedDeliverables();
    var box = $('#preview');
    if (!date || !dels.length) { clear(box).appendChild(document.createTextNode('Pick a date and what you need to see your timeline.')); return; }
    clear(box).appendChild(el('div', { class: 'spinner', text: 'Building timeline…' }));
    api('apiPreviewTimeline', date, dels).then(function (p) {
      clear(box);
      if (p.rush) {
        box.appendChild(el('div', { class: 'notice err' }, [
          el('b', { text: 'Rush request. ' }),
          'You are giving ' + p.leadDays + ' days of notice; our standard is ' + state.boot.minLeadDays +
          '. Some deadlines have been compressed — the communications team will follow up.'
        ]));
      }
      box.appendChild(timelineList(p.items, date));
    }).catch(function (e) { clear(box).appendChild(el('div', { class: 'notice err', text: e.message })); });
  }

  function timelineList(items, eventDate) {
    var ul = el('ul', { class: 'tl' });
    var eventShown = false;
    function eventLi() {
      return el('li', { class: 'event' }, [el('div', { class: 'date', text: pretty(eventDate) }), el('div', { class: 'what', text: 'Event / launch day' })]);
    }
    items.forEach(function (t) {
      if (!eventShown && eventDate && t.dueDate > eventDate) { ul.appendChild(eventLi()); eventShown = true; }
      ul.appendChild(el('li', { class: (t.rush ? 'rush ' : '') + (t.status === 'Done' ? 'done' : '') }, [
        el('div', { class: 'date' }, [pretty(t.dueDate), t.rush ? ' ' : null, t.rush ? el('span', { class: 'pill rush', text: 'RUSH' }) : null]),
        el('div', { class: 'what', text: t.task }),
        el('div', { class: 'meta', text: t.deliverable + ' · ' + t.assigneeName + (t.assigneeRole ? ' (' + t.assigneeRole + ')' : '') })
      ]));
    });
    if (!eventShown && eventDate) ul.appendChild(eventLi());
    return ul;
  }

  function readFiles(input) {
    var files = Array.prototype.slice.call(input.files || []);
    return Promise.all(files.map(function (f) {
      if (f.size > 10 * 1024 * 1024) return Promise.reject(new Error('"' + f.name + '" is over 10 MB. Put a Drive link in the design notes instead.'));
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () { resolve({ name: f.name, mimeType: f.type, data: String(r.result).split(',')[1] || '' }); };
        r.onerror = function () { reject(new Error('Could not read ' + f.name)); };
        r.readAsDataURL(f);
      });
    }));
  }

  $('#requestForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var form = ev.target;
    var btn = $('#submitBtn');
    var data = {};
    ['title', 'eventDate', 'eventTime', 'ministry', 'location', 'audience', 'description', 'keyMessage', 'callToAction', 'link', 'contact', 'designNotes']
      .forEach(function (k) { data[k] = form.elements[k].value; });
    data.deliverables = selectedDeliverables();

    if (!data.title.trim()) return notice('Please give the request a title.', 'err');
    if (!data.eventDate) return notice('Please choose an event or launch date.', 'err');
    if (!data.deliverables.length) return notice('Choose at least one thing you need.', 'err');

    btn.disabled = true; btn.textContent = 'Submitting…';
    readFiles($('#files')).then(function (files) {
      data.files = files;
      return api('apiSubmitRequest', data);
    }).then(function (res) {
      form.reset();
      if (state.boot.user.ministry) $('#ministrySelect').value = state.boot.user.ministry;
      clear($('#preview')).appendChild(document.createTextNode('Pick a date and what you need to see your timeline.'));
      var msg = 'Request ' + res.requestId + ' submitted — ' + res.taskCount + ' tasks assigned and everyone has been emailed.';
      if (res.rush) msg += ' It was flagged as a rush request.';
      notice(msg, res.warnings && res.warnings.length ? 'warn' : 'ok');
      refreshTaskBadge();
      openRequest(res.requestId);
    }).catch(fail).then(function () { btn.disabled = false; btn.textContent = 'Submit request'; });
  });

  /* ---------- my tasks ---------- */
  function refreshTaskBadge() {
    api('apiMyTasks').then(function (tasks) {
      state.tasks = tasks;
      var open = tasks.filter(function (t) { return t.status !== 'Done' && daysFromToday(t.dueDate) <= 7; }).length;
      var b = $('#taskBadge');
      b.hidden = !open; b.textContent = open;
    }).catch(function () {});
  }

  function loadTasks() {
    var box = clear($('#taskList'));
    box.appendChild(el('div', { class: 'spinner', text: 'Loading…' }));
    api('apiMyTasks').then(function (tasks) { state.tasks = tasks; renderTasks(); refreshTaskBadge(); }).catch(fail);
  }
  $('#showDone').addEventListener('change', renderTasks);

  function renderTasks() {
    var box = clear($('#taskList'));
    var showDone = $('#showDone').checked;
    var list = state.tasks.filter(function (t) { return showDone || t.status !== 'Done'; });
    if (!list.length) { box.appendChild(el('div', { class: 'empty', text: "You're all caught up. 🎉" })); return; }
    list.forEach(function (t) { box.appendChild(taskRow(t, true)); });
  }

  function taskRow(t, showRequest) {
    var select = el('select', {
      class: 'status-select', title: 'Update status',
      onclick: function (e) { e.stopPropagation(); },
      onchange: function () {
        select.disabled = true;
        api('apiUpdateTask', t.taskId, select.value).then(function (updated) {
          Object.assign(t, updated);
          node.parentNode.replaceChild(taskRow(t, showRequest), node);
          refreshTaskBadge();
        }).catch(function (err) { select.value = t.status; select.disabled = false; fail(err); });
      }
    }, ['Not Started', 'In Progress', 'Done'].map(function (s) {
      return el('option', { value: s, text: s, selected: s === t.status ? 'selected' : null });
    }));

    var node = el('div', { class: 'item clickable' + (t.status === 'Done' ? ' is-done' : ''), onclick: function () { openRequest(t.requestId); } }, [
      el('div', {}, [el('div', { class: 'sub', text: pretty(t.dueDate) }), duePill(t)]),
      el('div', {}, [
        el('div', { class: 'title', text: t.task }),
        el('div', { class: 'sub', text: (showRequest ? t.requestTitle + ' · ' + t.deliverable : t.deliverable + ' · ' + t.assigneeName) }),
        t.notes ? el('div', { class: 'sub', text: t.notes }) : null
      ]),
      el('div', { class: 'item-actions' }, [t.rush ? el('span', { class: 'pill rush', text: 'RUSH' }) : null, select])
    ]);
    return node;
  }

  /* ---------- all requests ---------- */
  function loadRequests() {
    var box = clear($('#requestList'));
    box.appendChild(el('div', { class: 'spinner', text: 'Loading…' }));
    api('apiRequests').then(function (r) { state.requests = r; renderRequests(); }).catch(fail);
  }
  $('#requestSearch').addEventListener('input', renderRequests);

  function renderRequests() {
    var box = clear($('#requestList'));
    var q = $('#requestSearch').value.trim().toLowerCase();
    var list = state.requests.filter(function (r) {
      return !q || [r.title, r.ministry, r.submitterName, r.requestId, r.deliverables].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    if (!list.length) { box.appendChild(el('div', { class: 'empty', text: q ? 'No matches.' : 'No requests yet.' })); return; }
    list.forEach(function (r) {
      var pct = r.total ? Math.round(100 * r.done / r.total) : 0;
      box.appendChild(el('div', { class: 'item clickable', onclick: function () { openRequest(r.requestId); } }, [
        el('div', {}, [el('div', { class: 'sub', text: 'Event' }), el('div', { text: pretty(r.eventDate) })]),
        el('div', {}, [
          el('div', { class: 'title', text: r.title }),
          el('div', { class: 'sub', text: [r.requestId, r.ministry, r.submitterName].filter(Boolean).join(' · ') }),
          el('div', { class: 'sub', text: r.deliverables }),
          el('div', { class: 'progress', title: r.done + ' of ' + r.total + ' tasks done' }, [el('div', { style: 'width:' + pct + '%' })])
        ]),
        el('div', {}, [r.rush ? el('span', { class: 'pill rush', text: 'RUSH' }) : null, ' ', el('span', { class: 'pill ' + r.status, text: r.status })])
      ]));
    });
  }

  /* ---------- team timeline ---------- */
  function loadTimeline() {
    var box = clear($('#timelineList'));
    box.appendChild(el('div', { class: 'spinner', text: 'Loading…' }));
    api('apiTeamTimeline').then(function (tasks) {
      state.timeline = tasks;
      var sel = $('#personFilter'), current = sel.value, people = {};
      tasks.forEach(function (t) { people[t.assigneeEmail] = t.assigneeName; });
      clear(sel).appendChild(el('option', { value: '', text: 'Everyone' }));
      Object.keys(people).sort(function (a, b) { return people[a].localeCompare(people[b]); })
        .forEach(function (e) { sel.appendChild(el('option', { value: e, text: people[e] })); });
      sel.value = people[current] ? current : '';
      renderTimeline();
    }).catch(fail);
  }
  $('#personFilter').addEventListener('change', renderTimeline);

  function weekLabel(iso) {
    var d = daysFromToday(iso);
    if (d < 0) return 'Overdue';
    var date = parseDate(iso);
    var monday = new Date(date); monday.setDate(date.getDate() - ((date.getDay() + 6) % 7));
    return 'Week of ' + monday.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function renderTimeline() {
    var box = clear($('#timelineList'));
    var who = $('#personFilter').value;
    var list = state.timeline.filter(function (t) { return !who || t.assigneeEmail === who; });
    if (!list.length) { box.appendChild(el('div', { class: 'empty', text: 'Nothing open. 🎉' })); return; }
    var last = null;
    list.forEach(function (t) {
      var label = weekLabel(t.dueDate);
      if (label !== last) { box.appendChild(el('div', { class: 'week-head', text: label })); last = label; }
      box.appendChild(el('div', { class: 'item clickable', onclick: function () { openRequest(t.requestId); } }, [
        el('div', {}, [el('div', { class: 'sub', text: pretty(t.dueDate) }), duePill(t)]),
        el('div', {}, [el('div', { class: 'title', text: t.task }), el('div', { class: 'sub', text: t.requestTitle + ' · ' + t.deliverable })]),
        el('div', {}, [t.rush ? el('span', { class: 'pill rush', text: 'RUSH' }) : null, ' ', el('span', { class: 'pill', text: t.assigneeName })])
      ]));
    });
  }

  /* ---------- request detail ---------- */
  function openRequest(id) {
    show('detail');
    var box = clear($('#detail'));
    box.appendChild(el('div', { class: 'spinner', text: 'Loading…' }));
    api('apiRequestDetail', id).then(function (d) {
      var r = d.request;
      clear(box);
      var fields = [
        ['Submitted by', r.submitterName + ' · ' + r.submittedAt], ['Ministry', r.ministry],
        ['Event date', pretty(r.eventDate) + (r.eventTime ? ' · ' + r.eventTime : '')], ['Location', r.location],
        ['Audience', r.audience], ['Deliverables', r.deliverables], ['Description', r.description],
        ['Key message / copy', r.keyMessage], ['Call to action', r.callToAction], ['Link', r.link],
        ['Contact', r.contact], ['Design notes', r.designNotes]
      ];
      var dl = el('dl', { class: 'kv' });
      fields.forEach(function (f) { if (f[1]) { dl.appendChild(el('dt', { text: f[0] })); dl.appendChild(el('dd', { text: f[1] })); } });
      if (r.filesUrl) {
        dl.appendChild(el('dt', { text: 'Files' }));
        dl.appendChild(el('dd', {}, [el('a', { href: r.filesUrl, target: '_blank', rel: 'noopener', text: 'Open Drive folder' })]));
      }

      box.appendChild(el('div', { class: 'layout-2col' }, [
        el('div', {}, [
          el('div', { class: 'card' }, [
            el('div', { class: 'card-head' }, [
              el('div', {}, [el('h2', { text: r.title }), el('div', { class: 'muted', text: r.requestId })]),
              el('div', {}, [r.rush ? el('span', { class: 'pill rush', text: 'RUSH' }) : null, ' ', el('span', { class: 'pill ' + r.status, text: r.status })])
            ]),
            dl
          ]),
          el('div', { class: 'card' }, [el('h3', { text: 'Tasks' })].concat(d.tasks.map(function (t) { return taskRow(t, false); })))
        ]),
        el('aside', { class: 'card sticky' }, [el('h3', { text: 'Timeline' }), timelineList(d.tasks, r.eventDate)])
      ]));
    }).catch(fail);
  }
})();
</script>
